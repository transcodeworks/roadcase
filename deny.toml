# `cargo deny check`: advisories, licences, bans and sources for the whole
# workspace, on every target the release workflow builds for.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
yanked = "deny"
# Each entry is revisited when the dependency that brings it moves.
ignore = [
    # OpenPGP's RSA and elliptic-curve arithmetic, under pgp 0.21.1, whose
    # releases have no fixed version to move to. roadcase-repo signs
    # repository metadata where the release is made; it answers no requests.
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9, through pgp 0.21.1: no fixed release" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5, through pgp 0.21.1" },
]

[licenses]
# Every licence a dependency may carry; each one is permissive.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Check the workspace crates' licences too.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
